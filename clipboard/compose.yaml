name: relay-paste
services:
  paste:
    build: .
    image: relay-paste:local
    container_name: relay-paste
    restart: unless-stopped
    env_file: .env
    volumes:
      - paste-data:/data
    networks:
      - apps-network
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    pids_limit: 64
    mem_limit: 128m
    cpus: 0.25
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3020/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
    logging:
      driver: json-file
      options: { max-size: "5m", max-file: "2" }
volumes:
  paste-data:
networks:
  apps-network:
    external: true
